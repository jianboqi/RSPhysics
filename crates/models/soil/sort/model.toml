[model]
id = "soil.sort"
name = "SORT"
family = "SORT"
category = "soil"
scientific_version = "1.0.0"
implementation_version = "0.1.0"
api_version = "0.1"
status = "reference-validated"
limitations = "400-2400 nm embedded soil basis; forward optical reflectance. SORT supports none, Hapke single/multifacet and Shiltz single/full roughness; refracted/external substrate angles; legacy scalar, directional single-pass and experimental angular-adding water transport. Adding with nonzero Shiltz roughness is not validated and is rejected. Legacy scalar wet BRF is not a general reciprocal BSDF. Parameter ranges and energy screening do not establish observational validity."
[source]
crate = "rsphysics-sort"
authors = ["Anxin Ding"]
references = ["Ding, A. (2026). SORT / SORT-L: Soil Optical Radiative Transfer Model. Model documentation, version 1.0.0."]
license = "LicenseRef-SORT-Author-Authorized AND MIT"
[capabilities]
native = true
python = true
wasm = false
batch = true
precision = "f64"
[validation]
[[validation.evidence]]
kind = "implementation"
suite = "sort-supplied-python-v1"
implementation_version = "0.1.0"
backend = "native"
[[validation.evidence]]
kind = "implementation"
suite = "sort-supplied-python-v1"
implementation_version = "0.1.0"
backend = "python"
[data.hashes]
soil_basis = "sha256:ad52839c4b9ad852595c0830ec9332476b399be7fb9f582e881c2acd8bfd4e88"
[input_semantics."/soil_brightness"]
unit = "1"
axes = []
description = "Soil spectral brightness multiplier."
[input_semantics."/spectral_alpha_deg"]
unit = "deg"
axes = []
description = "First spherical mixing angle of the soil spectral basis."
[input_semantics."/spectral_gamma_deg"]
unit = "deg"
axes = []
description = "Second spherical mixing angle of the soil spectral basis."
[input_semantics."/water_coverage"]
unit = "1"
axes = []
description = "Water-film covered surface fraction."
[input_semantics."/water_film_thickness_mm"]
unit = "mm"
axes = []
description = "Water-film thickness in millimetres."
[input_semantics."/particle_volume_fraction"]
unit = "1"
axes = []
description = "Particle volume fraction within the water film."
[input_semantics."/particle_refractive_index"]
unit = "1"
axes = []
description = "Real refractive index of particles in the film."
[input_semantics."/particle_extinction_coefficient"]
unit = "1"
axes = []
description = "Non-negative imaginary refractive index of film particles."
[input_semantics."/solar_zenith_deg"]
unit = "deg"
axes = []
description = "Solar zenith relative to the local surface normal."
[input_semantics."/view_zenith_deg"]
unit = "deg"
axes = []
description = "Viewing zenith relative to the local surface normal."
[input_semantics."/relative_azimuth_deg"]
unit = "deg"
axes = []
description = "Folded relative azimuth; equal zeniths and zero azimuth define the hotspot."
[input_semantics."/phase_asymmetry"]
unit = "1"
axes = []
description = "Two-term Henyey-Greenstein asymmetry parameter b."
[input_semantics."/phase_backscatter"]
unit = "1"
axes = []
description = "Two-term phase mixing parameter c, subject to a joint non-negativity constraint."
[input_semantics."/hotspot_amplitude"]
unit = "1"
axes = []
description = "Shadow-hiding hotspot amplitude B0."
[input_semantics."/hotspot_width"]
unit = "1"
axes = []
description = "Positive hotspot width h."
[input_semantics."/solid_filling_factor"]
unit = "1"
axes = []
description = "Solid filling factor F; porosity equals one minus F."
[input_semantics."/rms_slope"]
unit = "1"
axes = []
description = "Dimensionless optical RMS slope; inactive with no roughness correction."
[input_semantics."/multifacet_reflectance"]
unit = "1"
axes = []
description = "Diffuse reflectance factor for Hapke multifacet roughness rescaling."
[input_semantics."/roughness_correction"]
unit = "1"
axes = []
description = "Macroscopic roughness operator: none, hapke_single, or hapke_multi."
[output_semantics."/wavelengths_nm"]
unit = "nm"
axes = ["wavelength"]
description = "400-2400 nm, 1 nm sampling."
[output_semantics."/dry_brf"]
unit = "1"
quantity = "brf"
axes = ["wavelength"]
description = "Directional BRF; pi times BRDF."
[output_semantics."/wet_brf"]
unit = "1"
quantity = "brf"
axes = ["wavelength"]
description = "Directional BRF; pi times BRDF."

[input_semantics."/substrate_angle_mode"]
unit = "1"
axes = []
description = "refracted (default) or external substrate directions for legacy scalar transport."
[input_semantics."/water_film_mode"]
unit = "1"
axes = []
description = "legacy_scalar, single_pass (Beer-Lambert with radiance Jacobian), or convergence-checked angular adding (experimental)."

[output_semantics."/dry_basis_reflectance"]
unit = "1"
axes = ["wavelength"]
description = "Dry soil spectral basis reflectance before the directional scattering operator."

[output_semantics."/single_scattering_albedo"]
unit = "1"
axes = ["wavelength"]
description = "SSA inferred from the dry spectral basis."

[output_semantics."/substrate_brf"]
unit = "1"
axes = ["wavelength"]
description = "Covered substrate BRF before film propagation and any adding return paths."
