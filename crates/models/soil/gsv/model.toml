description="GSV1 uses c1 and csm; GSV3 uses all four coefficients. c2/c3 have no effect in GSV1."
[input_semantics."/c1"]
unit="1"
axes=[]
description="First dry vector coefficient, controls brightness empirically."
[input_semantics."/c2"]
unit="1"
axes=[]
description="Second dry vector shape coefficient, used in GSV3 only."
[input_semantics."/c3"]
unit="1"
axes=[]
description="Third dry vector shape coefficient, used in GSV3 only."
[input_semantics."/csm"]
unit="1"
axes=[]
description="Moisture vector coefficient [-0.6,0]; zero dry, not a volumetric moisture fraction."
[input_semantics."/wavelengths_nm"]
unit="nm"
axes=["requested_wavelength"]
description="Empty means 211 native wavelengths 400..2500 nm, step10; explicit arbitrary ordered requests stay in [400,2500]."
[output_semantics."/dry_reflectance"]
unit="1"
axes=["wavelength"]
description="Dry basis linear combination, algebraic and unclipped."
[output_semantics."/moisture_contribution"]
unit="1"
axes=["wavelength"]
description="Additive csm times moisture vector."
[output_semantics."/reflectance"]
unit="1"
axes=["wavelength"]
description="Dry reflectance plus moisture contribution, unclipped."
[output_semantics."/wavelengths_nm"]
unit="nm"
axes=["wavelength"]
description="Native axis or requested wavelength order."
[output_semantics."/outside_unit_interval_count"]
