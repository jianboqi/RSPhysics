name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RSP_GIT_REVISION: ${{ github.sha }}
  RSP_BUILD_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  native:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install GNU Fortran
        id: fortran
        uses: fortran-lang/setup-fortran@1f630c95fa9e0c941248f52e4674260139020365 # v1
        with:
          compiler: gcc
          version: '13'
          update-environment: false
      - name: Select the Fortran compiler
        env:
          RSP_FORTRAN_COMPILER: ${{ steps.fortran.outputs.fc }}
        run: python tooling/ci/configure_fortran.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify catalog and resources offline
        run: python tooling/ci/verify_resources.py

  source-distribution:
    name: Source archive / clean installation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sdist-build
      RUSTUP_TOOLCHAIN: '1.97.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install GNU Fortran
        id: fortran
        uses: fortran-lang/setup-fortran@1f630c95fa9e0c941248f52e4674260139020365 # v1
        with:
          compiler: gcc
          version: '13'
          update-environment: false
      - name: Select the Fortran compiler
        env:
          RSP_FORTRAN_COMPILER: ${{ steps.fortran.outputs.fc }}
        run: python tooling/ci/configure_fortran.py
      - run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - run: python -m pip install "maturin[patchelf]==1.16.0" "numpy>=1.26" "pytest>=8,<10"
      - run: python -m maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
      - name: Install from the source archive
        run: python -m pip install --no-build-isolation --no-deps dist/*.tar.gz
      - name: Test installed source build
        run: python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
