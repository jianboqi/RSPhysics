name: Submit a model
description: Propose a remote sensing model for inclusion in RSPhysics.
title: "[Model] "
body:
  - type: markdown
    attributes:
      value: |
        Submit your existing implementation in its original language. A maintainer
        will review the submission before deciding
        whether to port the model to Rust. Follow this issue for questions and updates.
  - type: textarea
    id: model
    attributes:
      label: Model description and attribution
      description: Give the model name, physical assumptions, intended use, original authors, and preferred citation or documentation link.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Reference implementation and permissions
      description: Paste a source link or drag a ZIP archive of the code into this field (up to 25 MB). Identify the version and include the license or permission details for the code and any required data or coefficient tables.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Reproducible example (optional)
      description: If available, share a command or function call, inputs and units, and expected outputs and units. You can link or attach example files.
    validations:
      required: false
